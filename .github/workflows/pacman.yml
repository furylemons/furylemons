name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Pacman Grafiği Üret
    runs-on: ubuntu-latest

    steps:
      - name: Repoyu Klonla
        uses: actions/checkout@v4

      - name: Python Ortamını Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Gerekli Paketleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pacman SVG Oluştur
        run: |
          cat << 'EOF' > generate_pacman.py
          import requests
          import json

          # GitHub katkı verisini alıp Pacman SVG'si üreten işlem
          user = "FuryLemons"
          url = f"https://github-contributions-api.johannchopin.fr/{user}"
          response = requests.get(url)
          
          # Varsayılan şablon SVG oluşturma
          svg_content = '''<svg width="400" height="100" xmlns="http://www.w3.org/2000/svg">
            <rect width="100%" height="100%" fill="#0d1117"/>
            <text x="20" y="50" fill="#e3b341" font-family="monospace" font-size="20">CNOA - Pacman Loading...</text>
          </svg>'''
          
          with open("github-pacman.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)
          EOF
          python generate_pacman.py

      - name: Dosyayı Repoya Commit Et ve Gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-pacman.svg
          git commit -m "chore: pacman svg guncellendi" || exit 0
          git push
