name: Generate Pacman Animation

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate SVG
        run: |
          cat << 'EOF' > generate_pacman.py
          svg_content = '''<svg width="490" height="120" xmlns="http://www.w3.org/2000/svg">
            <style>
              .bg { fill: #0d1117; rx: 8px; }
              @keyframes chomp {
                0% { d: path('M 0 0 L 12 12 A 15 15 0 1 0 12 -12 Z'); }
                50% { d: path('M 0 0 L 15 3 A 15 15 0 1 0 15 -3 Z'); }
                100% { d: path('M 0 0 L 12 12 A 15 15 0 1 0 12 -12 Z'); }
              }
              @keyframes movePacman {
                0% { transform: translateX(30px); }
                100% { transform: translateX(380px); }
              }
              .pacman-group {
                animation: movePacman 6s linear infinite;
              }
              .dots { fill: #30a14e; }
            </style>
            
            <rect width="100%" height="100%" class="bg"/>
            
            <circle cx="80" cy="60" r="4" class="dots" />
            <circle cx="130" cy="60" r="4" class="dots" />
            <circle cx="180" cy="60" r="4" class="dots" />
            <circle cx="230" cy="60" r="4" class="dots" />
            <circle cx="280" cy="60" r="4" class="dots" />
            <circle cx="330" cy="60" r="4" class="dots" />
            <circle cx="380" cy="60" r="4" class="dots" />
            <circle cx="430" cy="60" r="4" class="dots" />

            <g class="pacman-group">
              <path fill="#f2e835" transform="translate(0, 60)" d="M 0 0 L 12 12 A 15 15 0 1 0 12 -12 Z">
                <animate attributeName="d" values="M 0 0 L 12 12 A 15 15 0 1 0 12 -12 Z; M 0 0 L 15 2 A 15 15 0 1 0 15 -2 Z; M 0 0 L 12 12 A 15 15 0 1 0 12 -12 Z" dur="0.3s" repeatCount="indefinite" />
              </path>
            </g>
          </svg>'''

          with open("github-pacman.svg", "w", encoding="utf-8") as f:
              f.write(svg_content)
          EOF
          python generate_pacman.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add github-pacman.svg
          git commit -m "chore: update pacman svg" || exit 0
          git push
